<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Coin Collection</title>
<meta name="description" content="A collection of coins from British India and the Republic of India, photographed front and back.">
<meta name="theme-color" content="#0b0b0d">

<meta property="og:title" content="The Coin Collection">
<meta property="og:description" content="Coins of British India and the Republic of India, photographed front and back.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.garvitgupta.com/coins/">

<link rel="icon" href="../favicon/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/coins.css">

<!-- Set the theme before first paint, so there's no flash of the wrong one.
     Deliberately inline and synchronous; an external file would be too late. -->
<script>
(function () {
  try {
    var saved = localStorage.getItem("coins:theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = theme;
  } catch (e) {
    document.documentElement.dataset.theme = "dark";
  }
})();
</script>
</head>
<body>

<a class="skip-link" href="#grid">Skip to the collection</a>

<!-- Always present, on the published site as well as while editing. Editing
     adds its own controls to the right-hand side; navigation lives here. -->
<div class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="topbar-lead">
      <button type="button" class="eb eb-home" id="btn-home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.6V20h12V9.6"/>
        </svg>
        <span>Home</span>
      </button>
    </div>
    <div class="topbar-tail" id="topbar-tail"></div>
    <button type="button" class="eb eb-icon theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/>
    </svg>
</button>
  </div>
</div>


<header class="masthead">
  <div class="masthead-inner">
    <p class="eyebrow">A private collection</p>
    <h1 class="masthead-title">Coins</h1>
    <p class="masthead-blurb">
      Coins of British India and the Republic of India, photographed on both faces.
      Click any coin to turn it over and look closely.
    </p>
    <p class="masthead-count" id="count" aria-live="polite"></p>
  </div>
</header>

<main class="shell">
  <!-- Filters live in a column of their own. Populated from the catalogue, so
       an option only appears if at least one coin actually has that value. -->
  <aside class="sidebar" id="filterbar" hidden aria-label="Filter the collection">
    <div class="sidebar-inner">
      <div class="sidebar-head">
        <button type="button" class="rail-toggle" id="btn-filters"
                aria-expanded="true" aria-label="Hide filters">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
          </svg>
        </button>
        <h2 class="sidebar-title">Filter</h2>
        <button type="button" class="clear-filters" id="clear-filters" hidden>Clear</button>
      </div>

      <section class="facet facet-sort">
        <h3 class="facet-title">Order</h3>
        <label class="sort">
          <span class="sr-only">Sort</span>
          <select id="sort">
            <option value="year-desc">Newest first</option>
            <option value="year-asc">Oldest first</option>
            <option value="denomination">Denomination</option>
            <option value="added">Recently added</option>
          </select>
        </label>
      </section>

      <div class="filters" id="filters"></div>
    </div>
  </aside>

  <div class="collection">
    <div class="search">
      <label class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20 20"/>
        </svg>
        <input type="search" id="search" autocomplete="off" spellcheck="false"
               placeholder="Search the collection" aria-label="Search the collection">
        <button type="button" class="search-clear" id="search-clear" hidden aria-label="Clear search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10"/><path d="M17 7L7 17"/></svg>
        </button>
      </label>
    </div>

    <ul class="grid" id="grid" aria-label="The collection"></ul>
    <p class="empty" id="empty" hidden></p>
  </div>
</main>

<footer class="colophon">
  <p>Photographed and catalogued by hand.</p>
  <p><a href="/">garvitgupta.com</a></p>
</footer>

<!-- Viewer. Built once, reused for every coin; contents swapped on open. -->
<div class="viewer" id="viewer" hidden tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <button type="button" class="viewer-nav viewer-prev" id="viewer-prev" aria-label="Previous coin">&#8249;</button>
  <button type="button" class="viewer-nav viewer-next" id="viewer-next" aria-label="Next coin">&#8250;</button>

  <div class="viewer-body">
    <div class="stage" id="stage">
      <div class="stage-frame" id="stage-frame">
        <div class="flipper" id="flipper">
          <div class="face face-obv" data-label="Obverse"><img id="img-obv" alt="" draggable="false"></div>
          <div class="face face-rev" data-label="Reverse"><img id="img-rev" alt="" draggable="false"></div>
        </div>
      </div>
      <div class="stage-controls">
        <div class="face-toggle" role="group" aria-label="Which side to show">
          <button type="button" data-face="obv" class="is-active" id="btn-obv">Obverse</button>
          <button type="button" data-face="rev" id="btn-rev">Reverse</button>
        </div>
        <p class="stage-hint" id="stage-hint">Scroll to zoom &middot; drag to pan</p>
      </div>
    </div>

    <aside class="detail" id="detail">
      <p class="detail-era" id="detail-era"></p>
      <h2 class="detail-title" id="viewer-title"></h2>
      <p class="detail-notes" id="detail-notes"></p>
      <div class="detail-specs" id="detail-specs"></div>
    </aside>
  </div>
</div>

<script src="js/coins.js"></script>
<script src="js/viewer.js"></script>
<script src="js/edit.js"></script>
</body>
</html>
