<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packman personalities</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DE; --ink:#2B2140; --mut:#7A6F90; --card:#FFFFFF; --wash:rgba(43,33,64,.06); --sun:#FFC93C; --face:#2B2140; --bw:2.5px;
  --f:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif}
@media (prefers-color-scheme:dark){ :root{--bg:#1F1A30; --ink:#0D0A17; --mut:#A99FC4; --card:#2E2746; --wash:rgba(255,244,222,.08)} body{color:#FFF4DE} }
*{box-sizing:border-box}
body{margin:0; padding:28px 18px 56px; font-family:var(--f); color:#2B2140; background:var(--bg); background-image:radial-gradient(rgba(43,33,64,.09) 1.6px, transparent 1.7px); background-size:26px 26px}
main{max-width:760px; margin:0 auto}
/* the way back, at the top: a button like the ones in the game's own bar */
.back{display:inline-flex; align-items:center; gap:8px; height:42px; margin:0 0 20px; padding:0 16px 0 11px; font-size:16px; font-weight:600; color:inherit; text-decoration:none;
  background:var(--card); border:var(--bw) solid var(--ink); border-radius:14px; transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.back svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.back:hover{transform:translateY(-2px)} .back:active{transform:translateY(1px)}
.back:focus-visible{outline:3px solid #4DA8FF; outline-offset:2px}
h1{margin:0; font-size:34px; font-weight:700; line-height:1.1}
.lead{margin:8px 0 0; font-size:16px; font-weight:500; line-height:1.4; color:var(--mut)}
.cast{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; margin:22px 0 0; padding:0; list-style:none}
.cast button{display:flex; flex-direction:column; align-items:center; width:100%; height:100%; padding:16px 10px 14px; font:inherit; color:inherit; text-align:center; background:var(--card); border:var(--bw) solid var(--ink); border-radius:20px; cursor:pointer; -webkit-tap-highlight-color:transparent}
.cast button:hover{transform:translateY(-1px)} .cast button:active{transform:translateY(1px)}
.cast svg{display:block; width:84px; height:84px; margin:0 auto 10px; overflow:visible}
.cast b{display:block; font-size:17px; font-weight:600}
.cast span{display:block; margin-top:2px; font-size:14px; font-weight:500; line-height:1.3; color:var(--mut)}
.fill{fill:var(--c); stroke:var(--ink); stroke-width:.033; stroke-linejoin:round}
.eye{fill:var(--face)}
.mouth{fill:none; stroke:var(--face); stroke-width:.024; stroke-linecap:round}
.m-good,.m-bad,.shut,.wince{visibility:hidden} .on .m-good{visibility:visible} .on .m-idle{visibility:hidden}
.on svg{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-10px) scale(1.08)} 60%{transform:translateY(0) scale(.96,1.04)}}
.wear{fill:none; stroke:var(--face); stroke-width:.024; stroke-linecap:round; stroke-linejoin:round}
.wear.thin{stroke-width:.018} .wear.solid{fill:var(--face); stroke-width:.012}
.blush{fill:#D6305F; fill-opacity:.32}
.tongue{fill:#FF7A9C; stroke:var(--face); stroke-width:.018; stroke-linejoin:round}
.heart{fill:#E5263A; stroke:var(--face); stroke-width:.018; stroke-linejoin:round}
.plaster{fill:#F7DDB8; stroke:var(--face); stroke-width:.018}
.fringe{fill:#17121F; stroke:#17121F; stroke-width:.018; stroke-linejoin:round}
.tooth{fill:#fff; stroke:var(--face); stroke-width:.018; stroke-linejoin:round}
.fuse{fill:none; stroke:#C9BA98; stroke-width:.024; stroke-linecap:round}
.spark{fill:#FFC93C; stroke:#FF6B2C; stroke-width:.012; stroke-linejoin:round}
.shine{fill:#fff; fill-opacity:.8} .p-ghost .fill{fill-opacity:.88; stroke-dasharray:.06 .04}
.boo{fill:var(--face)} .hem{fill:none; stroke:#fff; stroke-width:.024; stroke-linecap:round; stroke-linejoin:round}
.honey{fill:#E8891A}
.spike{fill:none; stroke:#1596A6; stroke-width:.028; stroke-linecap:round}
.white{fill:#fff; stroke:var(--face); stroke-width:.018}
.zz{fill:none; stroke:#fff; stroke-width:.026; stroke-linecap:round; stroke-linejoin:round}
.yawn{fill:var(--face)} .drool{fill:#BFE9FF; stroke:#fff; stroke-width:.012; stroke-linejoin:round}
.lid,.p-sleeper .eye,.p-sleeper .mouth{visibility:hidden}
.pole{stroke:var(--face); stroke-width:.014} .pole.n{fill:#FF6B6B} .pole.s{fill:#4DA8FF}
h2{margin:40px 0 0; font-size:26px; font-weight:700; line-height:1.1}
.foot{margin-top:26px; font-size:14px; font-weight:500; color:var(--mut)} .foot a{color:inherit}
@media (max-width:380px){ .cast{grid-template-columns:1fr 1fr; gap:10px} }
@media (prefers-reduced-motion:reduce){ .on svg{animation:none} }
</style>
</head>
<body>
<main>
  <a class="back" href="./" aria-label="Back to Packman"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>Back to the game</a>
  <h1>Meet the shapes</h1>
  <p class="lead">Every shape in Packman is dealt a personality, and each has a voice. Tap one to hear it.</p>
  <ul id="cast" class="cast"></ul>
  <h2>The powers</h2>
  <p class="lead">In chapter two some shapes are dealt a power, different every time. Tap one to hear it.</p>
  <ul id="powers" class="cast"></ul>
  <p class="foot"><a href="./">Back to Packman</a></p>
</main>
<script src="faces.js"></script>
<script src="sounds.js"></script>
<script>
(function () {
  'use strict';
  var COLORS = ['#FF6B6B', '#FFC93C', '#3DDBB4', '#4DA8FF', '#9B7BFF', '#FF8FCB', '#FF9F45', '#B5E655', '#45D9E6', '#D987F5', '#FFB59E'];
  var actx = null;
  // the same one-note player the game has
  function tone(freq, dur, opts) {
    if (!actx) return;
    opts = opts || {};
    var t = actx.currentTime + (opts.at || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(opts.vol || 0.12, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var sounds = PackmanSounds(tone);
  function wake() {
    if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state !== 'running') actx.resume();
  }
  // A square, as it is in the game: PackmanPiece (in faces.js) builds the face and whatever is poured over it for both.
  // The outline is the game's too: drawn a hair inside its true edge, with the same small corners.
  function block(kit, color) {
    var P = PackmanPiece, d = P.block(0.465, 0.08), s = P.el('svg', kit.power ? 'p-' + kit.power : '', { viewBox: '-0.56 -0.56 1.12 1.12', 'aria-hidden': 'true' });
    s.style.setProperty('--c', kit.color || color);
    if (kit.ink) s.style.setProperty('--face', kit.ink);
    s.appendChild(P.el('path', 'fill', { d: d }));
    var goo = P.pour(kit, 'square', P.block(0.448, 0.063));   // up to the inside of the line, as in the game
    if (goo) s.appendChild(goo.g);
    s.appendChild(P.face(kit, 'square').face);
    return s;
  }
  [[PackmanFaces, 'cast'], [PackmanPowers, 'powers']].forEach(function (group) {
  var cast = document.getElementById(group[1]);
  group[0].forEach(function (kit, n) {
    var li = document.createElement('li'), btn = document.createElement('button'), b = document.createElement('b'), d = document.createElement('span'), off = 0;
    btn.type = 'button';
    b.textContent = kit.name; d.textContent = kit.about || kit.does;
    btn.appendChild(block(kit, COLORS[n % COLORS.length])); btn.appendChild(b); btn.appendChild(d);
    btn.addEventListener('click', function () {
      wake();
      sounds.voice(kit.voice);
      btn.classList.remove('on'); void btn.offsetWidth; btn.classList.add('on');   // start the hop over if it is tapped again
      clearTimeout(off); off = setTimeout(function () { btn.classList.remove('on'); }, 650);
    });
    li.appendChild(btn); cast.appendChild(li);
  });
  });
})();
</script>
</body>
</html>
