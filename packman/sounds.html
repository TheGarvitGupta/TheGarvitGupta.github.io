<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packman sounds</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DE; --ink:#2B2140; --mut:#7A6F90; --card:#FFFFFF; --wash:rgba(43,33,64,.06); --sun:#FFC93C; --mint:#3DDBB4; --bw:2.5px;
  --f:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif}
@media (prefers-color-scheme:dark){ :root{--bg:#1F1A30; --ink:#0D0A17; --mut:#A99FC4; --card:#2E2746; --wash:rgba(255,244,222,.08)} body{color:#FFF4DE} }
*{box-sizing:border-box}
body{margin:0; padding:28px 18px 56px; font-family:var(--f); color:#2B2140; background:var(--bg); background-image:radial-gradient(rgba(43,33,64,.09) 1.6px, transparent 1.7px); background-size:26px 26px}
main{max-width:640px; margin:0 auto}
h1{margin:0; font-size:34px; font-weight:700; line-height:1.1}
.lead{margin:8px 0 0; font-size:16px; font-weight:500; line-height:1.4; color:var(--mut)}
.all{margin:18px 0 6px}
h2{margin:30px 0 10px; font-size:14px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--mut)}
ul{list-style:none; margin:0; padding:0; background:var(--card); border:var(--bw) solid var(--ink); border-radius:20px; overflow:hidden}
li{display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px}
li + li{border-top:1.5px solid var(--wash)}
li.on{background:var(--wash)}
.what{flex:1; min-width:0}
.what b{display:block; font-size:17px; font-weight:600}
.what span{display:block; margin-top:1px; font-size:14px; font-weight:500; line-height:1.3; color:var(--mut)}
.play{display:flex; flex:none; gap:6px}
button{font:600 15px var(--f); color:#2B2140; background:var(--mint); border:var(--bw) solid var(--ink); border-radius:999px; padding:6px 14px 7px; cursor:pointer; white-space:nowrap}
button:hover{transform:translateY(-1px)} button:active{transform:translateY(1px)}
button.sun{background:var(--sun); font-size:17px; padding:9px 20px 10px}
.foot{margin-top:26px; font-size:14px; font-weight:500; color:var(--mut)} .foot a{color:inherit}
@media (max-width:460px){ li{flex-wrap:wrap} .play{margin-left:auto} }
</style>
</head>
<body>
<main>
  <h1>Packman sounds</h1>
  <p class="lead">Every sound in the game. None is a recording: each is a few notes written out in <code>sounds.js</code> and made by your browser as you press play.</p>
  <p class="all"><button class="sun" id="all">Play them all</button></p>
  <div id="list"></div>
  <p class="foot">Each shape also has a voice of its own: <a href="personalities.html">meet the shapes</a>. <a href="./">Back to Packman</a></p>
</main>
<script src="sounds.js"></script>
<script>
(function () {
  'use strict';
  var actx = null;
  // the same one-note player the game has
  function tone(freq, dur, opts) {
    if (!actx) return;
    opts = opts || {};
    var t = actx.currentTime + (opts.at || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(opts.vol || 0.12, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var sounds = PackmanSounds(tone), rows = [];
  function wake() {
    if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state !== 'running') actx.resume();
  }
  function play(name, arg, li) {
    wake();
    sounds[name](arg);
    li.classList.add('on');
    setTimeout(function () { li.classList.remove('on'); }, 450);
  }
  PackmanSounds.about.forEach(function (group) {
    var h = document.createElement('h2'), ul = document.createElement('ul');
    h.textContent = group[0];
    group[1].forEach(function (s) {
      var li = document.createElement('li'), what = document.createElement('div'), b = document.createElement('b'), d = document.createElement('span'), box = document.createElement('div');
      what.className = 'what'; box.className = 'play';
      b.textContent = s[0]; d.textContent = s[1];
      what.appendChild(b); what.appendChild(d);
      (s[2] || [undefined]).forEach(function (arg, n, all) {
        var btn = document.createElement('button');
        btn.textContent = all.length === 1 ? 'Play' : s[0] === 'fit' ? ['Early', 'Half way', 'Last one'][n] : arg + ' shapes';
        btn.addEventListener('click', function () { play(s[0], arg, li); });
        box.appendChild(btn);
      });
      rows.push({ name: s[0], arg: (s[2] || [])[s[2] ? s[2].length - 1 : 0], li: li });
      li.appendChild(what); li.appendChild(box); ul.appendChild(li);
    });
    document.getElementById('list').appendChild(h); document.getElementById('list').appendChild(ul);
  });
  document.getElementById('all').addEventListener('click', function () {
    wake();
    rows.forEach(function (r, n) { setTimeout(function () { play(r.name, r.arg, r.li); r.li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, n * 1500); });
  });
})();
</script>
</body>
</html>
